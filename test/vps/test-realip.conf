# TEST ONLY - never install this on the server.
# Lets the test client choose its IP address (to check the country lookup and
# per-IP rate limits) with an X-Test-Client-IP header. Without the header
# nginx uses the real peer address as usual.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Test-Client-IP;
