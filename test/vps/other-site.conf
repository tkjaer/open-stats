# TEST ONLY - stands in for the server's other sites.
# It is the default server for port 443, so stats.irq.dk is chosen by name as
# on the real server, and it logs errors normally to nginx's main error log
# (which the Dockerfile sets to level info). The tests use it to show that the
# error log works and records client IPs for other sites, but never for
# stats.irq.dk.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name other.example;

    ssl_certificate     /etc/ssl/stats.irq.dk/fullchain.pem;
    ssl_certificate_key /etc/ssl/stats.irq.dk/privkey.pem;

    access_log off;
    root /nonexistent;
}
