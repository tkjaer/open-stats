# open-stats collector: nginx site for stats.irq.dk
#
# Install as /etc/nginx/sites-available/stats.irq.dk.conf and symlink it into
# /etc/nginx/sites-enabled/ (see collector/README.md). It is included in nginx's
# http {} block, so the maps and zones below are global: every name starts with
# "openstats" to avoid clashing with the other sites on the server.
#
# What it does, for every request to stats.irq.dk:
#   * answers with an empty 204, whatever happens;
#   * writes no access log and no error log;
#   * forwards only "GET /<project>/count?lang=<allowed value>", with no
#     Sec-GPC: 1 or DNT: 1 header, to GoatCounter on 127.0.0.1:8081, rewritten
#     to GoatCounter's own format (/count?p=/<value>). Only the client IP is
#     passed on (for the country lookup); no browser header is forwarded.
#
# Needs nginx >= 1.13.4 (mirror module).

# ---- Allow-list: one line per project ----------------------------------------
# Matches the method and the raw request URI exactly as the browser sent it
# (no decoding, no extra parameters). The value is the project's GoatCounter
# site. Keep in sync with projects/<name>.yml (test/run.sh checks this).
map "$request_method $request_uri" $openstats_site {
    default "";
    "~^GET /how-the-internet-works/count\?lang=(?:en|da)$"     how-the-internet-works.localhost;
}

# GoatCounter's count URL for an allowed request: /count?p=/<value>.
map "$request_method $request_uri" $openstats_upstream_uri {
    default "";
    "~^GET /[a-z0-9-]+/count\?lang=([a-z0-9-]+)$"  "/count?p=/$1";
}

# ---- Requests that are never forwarded ----------------------------------------
# Global Privacy Control and Do Not Track.
map $http_sec_gpc $openstats_gpc {
    default 0;
    "1"     1;
}
map $http_dnt $openstats_dnt {
    default 0;
    "1"     1;
}

# Obvious bots and scripts. GoatCounter has its own bot detection, but it
# needs the User-Agent, and GoatCounter stores the User-Agent of every request
# it flags as a bot (for 30 days). So the User-Agent is checked here and never
# forwarded.
map $http_user_agent $openstats_bot {
    default 0;
    ""      1;
    "~*(bot|crawl|spider|slurp|headless|phantom|selenium|webdriver|puppeteer|playwright|lighthouse|pagespeed|curl|wget|python|go-http-client|java/|okhttp|libwww|httpclient|axios|node-fetch|undici|scrapy|facebookexternalhit|preview)" 1;
}

# Browser prefetch and prerender.
map "$http_purpose $http_sec_purpose $http_x_purpose $http_x_moz" $openstats_prefetch {
    default 0;
    "~*(prefetch|prerender|preview)" 1;
}

# 1 only for an allow-listed request without GPC/DNT, bot or prefetch markers.
map "$openstats_gpc$openstats_dnt$openstats_bot$openstats_prefetch $openstats_site" $openstats_forward {
    default 0;
    "~^0000 [a-z0-9.-]+$" 1;
}

# ---- Rate limit (forwarded requests only) ------------------------------------
# One cap for all projects together, to protect the rest of the server (see
# "Rate limit" in collector/README.md). There is deliberately no per-IP limit,
# so a class or an office behind one IP address is counted in full. The zone
# is keyed by the server name, so it holds no IP addresses. The cap also
# bounds how many addresses GoatCounter's own rate limiter holds in memory
# between its hourly restarts (see "GoatCounter's rate limiter" there).
limit_req_zone $server_name zone=openstats_global:1m rate=10r/s;

server {
    # If the server's other sites listen on specific addresses, use the same
    # ones here, or nginx never picks this server for them (see "Listen
    # addresses and the other sites" in collector/README.md). Never add
    # default_server.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.irq.dk;

    # CHANGE ME: the certificate and key for stats.irq.dk (renewed by hand).
    ssl_certificate     /etc/ssl/stats.irq.dk/fullchain.pem;
    ssl_certificate_key /etc/ssl/stats.irq.dk/privkey.pem;

    # No logs at all. "access_log off" alone isn't enough: nginx's error log
    # records the client's IP address on rate-limit rejections, malformed
    # requests, closed connections and upstream errors. This applies from the
    # moment nginx knows the connection is for stats.irq.dk (TLS SNI); see
    # collector/README.md for what happens before that.
    access_log off;
    error_log /dev/null crit;
    log_not_found off;
    log_subrequest off;
    server_tokens off;

    client_max_body_size 1k;
    keepalive_timeout 10s;

    add_header Cache-Control "no-store" always;

    # Every error becomes the same empty 204, including malformed requests
    # (400), oversized headers (494) and unknown HTTP versions (505).
    error_page 400 401 403 404 405 408 411 413 414 429 494 495 496 497 500 501 502 503 504 505
        =204 /_openstats_204;

    location / {
        if ($openstats_forward = 0) {
            return 204;
        }

        limit_req zone=openstats_global burst=200 nodelay;
        limit_req_status 429;
        limit_req_log_level info;

        # Forward a copy in the background; the browser gets its 204 at once
        # and never waits for (or hears about) GoatCounter.
        mirror /_openstats_upstream;
        mirror_request_body off;

        # No content here on purpose: nginx finds no file under this root,
        # returns 404, and error_page above turns that into the 204. (A
        # "return 204" would end the request before the mirror runs.)
        root /nonexistent;
    }

    location = /_openstats_upstream {
        internal;

        proxy_pass http://127.0.0.1:8081$openstats_upstream_uri;
        proxy_http_version 1.1;

        # Send nothing from the browser except its IP. GoatCounter reads the
        # client IP from X-Real-IP (and would also trust X-Forwarded-For,
        # Cf-Connecting-Ip, Fly-Client-Ip and X-Azure-Socketip, which is why no
        # browser header may pass through). Host picks the GoatCounter site. A
        # fixed User-Agent keeps GoatCounter from treating every request as a bot.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host $openstats_site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; open-stats-nginx/1)";
        proxy_set_header Content-Length "";

        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /_openstats_204 {
        internal;
        return 204;
    }
}
