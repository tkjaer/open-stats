# Unit tests, shellcheck, and the end-to-end checks against nginx and
# GoatCounter in a container (test/run.sh).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: shellcheck
        run: shellcheck -x collector/*.sh test/run.sh test/vps/entrypoint.sh test/vps/gcctl
      - name: tests
        run: test/run.sh
      - name: reproducible build
        run: |
          collector/build.sh
          cp dist/SHA256SUMS /tmp/first
          collector/build.sh
          diff /tmp/first dist/SHA256SUMS
